    delete:
      operationId: activities_sheets_destroy
      description: |-
        GET: Retrieve sheet details (includes column_snapshot)
        PUT/PATCH: Update sheet name
        DELETE: Soft-delete sheet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/activities/sheets/{sheet_id}/export/:
    get:
      operationId: activities_sheets_export_retrieve
      description: |-
        GET: Export sheet to Excel

        Query params:
        - include_data: bool (default=true) - Include row data or just headers
        - streaming: bool (default=auto) - Force streaming mode for large files
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/sheets/{sheet_id}/import/:
    post:
      operationId: activities_sheets_import_create
      description: |-
        POST: Import Excel data into sheet

        Body (multipart/form-data):
        - file: Excel file (.xlsx, .xls)
        - validate: bool (default=true) - Run validation before import
        - replace: bool (default=true) - Replace existing data or append
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/sheets/{sheet_id}/rows/:
    get:
      operationId: activities_sheets_rows_retrieve
      description: |-
        GET: List rows with cursor pagination
        POST: Create a single row
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: activities_sheets_rows_create
      description: |-
        GET: List rows with cursor pagination
        POST: Create a single row
