          description: ''
    patch:
      operationId: activities_sheets_partial_update
      description: |-
        GET: Retrieve sheet details (includes column_snapshot)
        PUT/PATCH: Update sheet name
        DELETE: Soft-delete sheet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivitySheetDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivitySheetDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivitySheetDetailRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
