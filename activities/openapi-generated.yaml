      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/quarterly/:
    get:
      operationId: activities_dashboard_quarterly_retrieve
      description: Get quarterly data.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/status-distribution/:
    get:
      operationId: activities_dashboard_status_distribution_retrieve
      description: Get status distribution.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/summary/:
    get:
      operationId: activities_dashboard_summary_retrieve
      description: Get KPI summary.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/years/:
    get:
      operationId: activities_dashboard_years_retrieve
      description: Get available years.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/my-sheets/:
    get:
      operationId: activities_my_sheets_retrieve
      description: |-
        GET: Get all user's sheets regardless of which title they belong to.
        This is for showing "recent sheets" even if title is deleted/deactivated.
        Includes sheets from deleted/archived templates.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/my-sheets/{sheet_id}/:
    get:
      operationId: activities_my_sheets_retrieve_2
      description: Get sheet details.
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: activities_my_sheets_partial_update
      description: Update sheet name/description.
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: activities_my_sheets_destroy
      description: Soft delete a sheet.
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/activities/my-sheets/{sheet_id}/submit/:
    post:
      operationId: activities_my_sheets_submit_create
      description: 'POST: Submit a sheet to admin. Once submitted, the sheet cannot
        be edited.'
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/rows/{id}/:
    get:
      operationId: activities_rows_retrieve
      description: |-
        GET: Retrieve a single row
        PUT/PATCH: Update a single row
        DELETE: Delete a single row
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySheetRow'
          description: ''
    put:
      operationId: activities_rows_update
      description: |-
        GET: Retrieve a single row
        PUT/PATCH: Update a single row
        DELETE: Delete a single row
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySheetRowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivitySheetRowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivitySheetRowRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySheetRow'
          description: ''
    patch:
      operationId: activities_rows_partial_update
      description: |-
        GET: Retrieve a single row
        PUT/PATCH: Update a single row
        DELETE: Delete a single row
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivitySheetRowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivitySheetRowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivitySheetRowRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySheetRow'
          description: ''
    delete:
      operationId: activities_rows_destroy
      description: |-
        GET: Retrieve a single row
        PUT/PATCH: Update a single row
        DELETE: Delete a single row
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/activities/rows/{row_id}/attachments/:
    get:
      operationId: activities_rows_attachments_retrieve
      description: List all attachments for a row.
      parameters:
      - in: path
        name: row_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: activities_rows_attachments_create
      description: Upload a new attachment.
      parameters:
      - in: path
        name: row_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/sheets/:
    get:
      operationId: activities_sheets_list
      description: |-
        GET: List user's sheets
        POST: Create a new sheet from a template
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivitySheetListList'
          description: ''
    post:
      operationId: activities_sheets_create
      description: |-
        GET: List user's sheets
        POST: Create a new sheet from a template
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySheetCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivitySheetCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivitySheetCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySheetCreate'
          description: ''
  /api/activities/sheets/{id}/:
    get:
      operationId: activities_sheets_retrieve
      description: |-
        GET: Retrieve sheet details (includes column_snapshot)
        PUT/PATCH: Update sheet name
        DELETE: Soft-delete sheet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySheetDetail'
          description: ''
    put:
      operationId: activities_sheets_update
      description: |-
        GET: Retrieve sheet details (includes column_snapshot)
        PUT/PATCH: Update sheet name
        DELETE: Soft-delete sheet
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivitySheetDetailRequest'
          application/x-www-form-urlencoded:
            schema:
