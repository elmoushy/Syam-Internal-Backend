openapi: 3.0.3
info:
  title: WeaponPowerCloud API
  version: 1.0.0
  description: API documentation for WeaponPowerCloud Activities System
paths:
  /api/activities/admin/sheets/{sheet_id}/data/:
    get:
      operationId: activities_admin_sheets_data_retrieve
      description: |-
        GET: Admin endpoint to view any sheet's data (read-only).
        Supports pagination, sorting, and filtering.
      parameters:
      - in: path
        name: sheet_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/admin/submitted-sheets/:
    get:
      operationId: activities_admin_submitted_sheets_retrieve
      description: |-
        GET: Get all submitted sheets from all users (admin only).
        Supports filtering by title_id and pagination.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/admin/templates/{template_id}/activities/:
    get:
      operationId: activities_admin_templates_activities_retrieve
      description: |-
        GET: Get all submitted activities for a specific template (admin only).
        Returns individual activity rows (not sheets), grouped by user if needed.
        Supports filtering by user_id and search in activity data.
      parameters:
      - in: path
        name: template_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/admin/templates/{template_id}/activities/export/:
    get:
      operationId: activities_admin_templates_activities_export_retrieve
      description: |-
        GET: Export activities for a specific template (admin only).
        Supports batched fetching for large datasets.
        Returns data without full pagination overhead for efficient export.

        Query params:
        - user_id: Filter by specific user
        - search: Search in row data and owner info
        - status: 'submitted', 'draft', or 'all' (default: submitted)
        - page: Page number for batched fetching (default: 1)
        - page_size: Items per page (default: 100, max: 500)
      parameters:
      - in: path
        name: template_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/admin/templates/{template_id}/users/:
    get:
      operationId: activities_admin_templates_users_retrieve
      description: |-
        GET: Get users with submission counts for a specific template (admin only).
        Supports filtering by search query on user names.
      parameters:
      - in: path
        name: template_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/attachments/{attachment_id}/:
    get:
      operationId: activities_attachments_retrieve
      description: Get attachment metadata (without file content).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: activities_attachments_destroy
      description: Delete an attachment.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/activities/attachments/{attachment_id}/download/:
    get:
      operationId: activities_attachments_download_retrieve
      description: Download attachment as base64.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/attachments/{attachment_id}/preview/:
    get:
      operationId: activities_attachments_preview_retrieve
      description: Preview image attachment.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/columns/:
    get:
      operationId: activities_columns_list
      description: |-
        GET: List all column definitions (active only by default)
        POST: Create a new column definition (admin only)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityColumnDefinitionList'
          description: ''
    post:
      operationId: activities_columns_create
      description: |-
        GET: List all column definitions (active only by default)
        POST: Create a new column definition (admin only)
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityColumnDefinitionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityColumnDefinitionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityColumnDefinitionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityColumnDefinitionCreate'
          description: ''
  /api/activities/columns/{column_id}/validations/:
    get:
      operationId: activities_columns_validations_list
      description: |-
        GET: List validations for a column
        POST: Create a validation rule (admin only)
      parameters:
      - in: path
        name: column_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityColumnValidationList'
          description: ''
    post:
      operationId: activities_columns_validations_create
      description: |-
        GET: List validations for a column
        POST: Create a validation rule (admin only)
      parameters:
      - in: path
        name: column_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityColumnValidationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityColumnValidationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityColumnValidationCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityColumnValidationCreate'
          description: ''
  /api/activities/columns/{id}/:
    get:
      operationId: activities_columns_retrieve
      description: |-
        GET: Retrieve a column definition
        PUT/PATCH: Update a column definition (admin only)
        DELETE: Soft-delete a column definition (admin only, non-system only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityColumnDefinition'
          description: ''
    put:
      operationId: activities_columns_update
      description: |-
        GET: Retrieve a column definition
        PUT/PATCH: Update a column definition (admin only)
        DELETE: Soft-delete a column definition (admin only, non-system only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityColumnDefinitionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityColumnDefinitionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityColumnDefinitionUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityColumnDefinitionUpdate'
          description: ''
    patch:
      operationId: activities_columns_partial_update
      description: |-
        GET: Retrieve a column definition
        PUT/PATCH: Update a column definition (admin only)
        DELETE: Soft-delete a column definition (admin only, non-system only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedActivityColumnDefinitionUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedActivityColumnDefinitionUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedActivityColumnDefinitionUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityColumnDefinitionUpdate'
          description: ''
    delete:
      operationId: activities_columns_destroy
      description: |-
        GET: Retrieve a column definition
        PUT/PATCH: Update a column definition (admin only)
        DELETE: Soft-delete a column definition (admin only, non-system only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/activities/columns/detect-from-excel/:
    post:
      operationId: activities_columns_detect_from_excel_create
      description: |-
        POST: Detect column definitions from an uploaded Excel file.
        Used by frontend to auto-detect columns when creating templates from Excel.

        Body (multipart/form-data):
        - file: Excel file (.xlsx, .xls)

        Returns list of detected columns with name, type, and width.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/department-stats/:
    get:
      operationId: activities_dashboard_department_stats_retrieve
      description: Get department statistics.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/departments/:
    get:
      operationId: activities_dashboard_departments_retrieve
      description: Get list of departments.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/departments/{department_id}/:
    get:
      operationId: activities_dashboard_departments_retrieve_2
      description: Get department detail statistics.
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/full/:
    get:
      operationId: activities_dashboard_full_retrieve
      description: Get full dashboard data.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/monthly-trend/:
    get:
      operationId: activities_dashboard_monthly_trend_retrieve
      description: Get monthly trend.
      tags:
