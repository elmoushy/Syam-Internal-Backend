      description: Get programs performance.
      tags:
      - activities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/activities/dashboard/programs/{template_id}/:
    get:
      operationId: activities_dashboard_programs_retrieve_2
      description: Get program detail statistics.
      parameters:
      - in: path
        name: template_id
        schema:
          type: integer
        required: true
      tags:
